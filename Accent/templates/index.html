<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🌍 Accent Voice Generator</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --text: #333;
      --card-bg: #fff;
      --primary: #007bff;
      --primary-hover: #0056b3;
      --secondary: #00d4ff;
      --alert-success-bg: #e6ffed;
      --alert-success-text: #027a48;
      --alert-error-bg: #ffebe9;
      --alert-error-text: #d92d20;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
      --card-bg: #1e1e1e;
      --primary: #339af0;
      --primary-hover: #1c7ed6;
      --secondary: #66d9e8;
      --alert-success-bg: #2e5035;
      --alert-success-text: #b6e3b6;
      --alert-error-bg: #5f1b1b;
      --alert-error-text: #ffb3b3;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family:'Segoe UI',sans-serif; transition: background 0.3s, color 0.3s; }
    .theme-switch { position:absolute; top:20px; right:20px; }
    .container { max-width:800px; margin:auto; padding:40px 20px; }
    .hero { text-align:center; padding-bottom:20px; }
    .hero h1 { font-size:2.5rem; background:linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip:text; color:transparent; }
    .hero p { margin-top:8px; opacity:0.8; }
    .card { background:var(--card-bg); border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,0.1); overflow:hidden; }
    .card-body { padding:30px; }
    .form-group { margin-bottom:20px; }
    .form-label { display:block; margin-bottom:8px; font-weight:500; }
    textarea, select { width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; background:var(--bg); color:var(--text); transition:border-color 0.3s; }
    textarea:focus, select:focus { outline:none; border-color:var(--primary); }
    button { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer; transition:background 0.3s; }
    button:hover { background:var(--primary-hover); }
    .loader { display:none; margin:20px auto; border:6px solid #eee; border-top:6px solid var(--primary); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; }
    @keyframes spin { to{ transform:rotate(360deg);} }
    .alert { margin-top:20px; padding:12px; border-radius:6px; }
    .alert-success { background:var(--alert-success-bg); color:var(--alert-success-text); }
    .alert-error { background:var(--alert-error-bg); color:var(--alert-error-text); }
    .preview { margin-top:20px; text-align:center; }
    .preview audio { width:100%; border-radius:6px; }
    .download, .copy-link { display:inline-block; margin-top:12px; margin-right:8px; padding:10px 20px; background:var(--secondary); color:#fff; border-radius:6px; text-decoration:none; transition:background 0.3s; cursor:pointer; }
    .download:hover, .copy-link:hover { background:#00aacc; }
    @media (max-width:600px) {
      .hero h1 { font-size:2rem; }
      button, textarea, select { padding:10px; }
    }
  </style>
</head>
<body>
  <div class="theme-switch">
    <label><input type="checkbox" id="toggleTheme"> Dark Mode</label>
  </div>
  <div class="container">
    <div class="hero">
      <h1>🌍 Accent Voice Generator</h1>
      <p>Choose your accent and generate lifelike speech.</p>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="POST" onsubmit="showLoader()">
          <div class="form-group">
            <label class="form-label" for="text">Your Text</label>
            <textarea id="text" name="text" rows="4" placeholder="Enter English text..." required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="voice">Select Accent & Voice</label>
            <select id="voice" name="voice" required>
              <option value="">-- Choose a Voice --</option>
              {% for group, vs in voices.items() %}
                <optgroup label="{{ group }}">
                  {% for key in vs.keys() %}
                    <option value="{{ key }}">{{ key }}</option>
                  {% endfor %}
                </optgroup>
              {% endfor %}
            </select>
          </div>
          <button type="submit">Generate Speech</button>
        </form>
        <div class="loader" id="loader"></div>
        {% if message %}
          <div class="alert {% if audio_file %}alert-success{% else %}alert-error{% endif %}">{{ message }}</div>
        {% endif %}
        {% if audio_file %}
          <div class="preview">
            <audio controls>
              <source src="{{ audio_file }}" type="audio/mp3" />
            </audio>
            <div>
              <a class="download" href="{{ audio_file }}" download>⬇️ Download MP3</a>
              <button class="copy-link" onclick="copyLink()">📋 Copy Link</button>
            </div>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
  <script>
    const toggle = document.getElementById('toggleTheme');
    toggle.addEventListener('change', () => {
      document.documentElement.setAttribute('data-theme', toggle.checked ? 'dark' : 'light');
    });
    function showLoader(){ document.getElementById('loader').style.display='block'; }
    function copyLink() {
      const link = window.location.origin + document.querySelector('.download').getAttribute('href');
      navigator.clipboard.writeText(link).then(() => {
        alert('Link copied to clipboard!');
      });
    }
  </script>
</body>
</html>
